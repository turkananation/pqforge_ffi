name: pqforge_ffi
description: >-
  Hardware-accelerated post-quantum cryptography for Dart: a native AWS-LC
  engine (ML-KEM, ML-DSA, X25519, Ed25519, AEAD, STREAM) with a byte-compatible
  pure-Dart fallback.
version: 0.1.0
repository: https://github.com/turkananation/pqforge_ffi

environment:
  sdk: ^3.12.0

# Add regular dependencies here.
dependencies:
  ffi: ^2.2.0
  pointycastle: ^4.0.0
  # 0.3.0 adds the classical + lattice provider seams this package accelerates.
  pqforge: ^0.3.0
  # path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
